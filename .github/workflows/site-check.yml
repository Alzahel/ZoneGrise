name: Site check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'

      - name: Install dependencies
        run: npm install

      - name: Diagnose GoatCounter public counter
        run: |
          check() {
            label="$1"
            url="$2"
            status=$(curl -sS -L -w '%{http_code}' -o /tmp/goatcounter.json "$url" || true)
            body=$(cat /tmp/goatcounter.json 2>/dev/null || true)
            echo "$label | $status | $body"
          }
          check 'with-base' 'https://alzahel.goatcounter.com/counter/%2FZoneGrise%2Farticles%2F03-lhumain-est-il-interchangeable.json'
          check 'without-base' 'https://alzahel.goatcounter.com/counter/%2Farticles%2F03-lhumain-est-il-interchangeable.json'
          check 'with-trailing-slash' 'https://alzahel.goatcounter.com/counter/%2FZoneGrise%2Farticles%2F03-lhumain-est-il-interchangeable%2F.json'
          check 'total' 'https://alzahel.goatcounter.com/counter/TOTAL.json'

      - name: Build Astro site
        run: npm run build
