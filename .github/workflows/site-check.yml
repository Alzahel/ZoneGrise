name: Site check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'

      - name: Install dependencies
        run: npm install

      - name: Diagnose GoatCounter public counter
        run: |
          url='https://alzahel.goatcounter.com/counter/%2FZoneGrise%2Farticles%2F03-lhumain-est-il-interchangeable.json'
          status=$(curl -sS -L -w '%{http_code}' -o /tmp/goatcounter.json "$url" || true)
          echo "GOATCOUNTER_STATUS=$status"
          echo 'GOATCOUNTER_BODY_BEGIN'
          cat /tmp/goatcounter.json || true
          echo
          echo 'GOATCOUNTER_BODY_END'

      - name: Build Astro site
        run: npm run build
