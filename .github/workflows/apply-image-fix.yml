name: Apply verified image fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-image-fix.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: verified-image-fix
  cancel-in-progress: false

jobs:
  build-and-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Import verified text fragments from staging
        run: |
          git fetch origin image-fix-validate:image-fix-validate
          git checkout image-fix-validate -- \
            assets/fix-a2-p01.part00.b64 \
            assets/fix-a2-p01.part01.b64 \
            assets/fix-a2-p03.part00.b64 \
            assets/fix-a2-p03.part01.b64 \
            assets/fix-a4-p03.part00.b64 \
            assets/fix-a4-p03.part01.b64 \
            assets/fix-a4-p04.part00.b64 \
            assets/fix-a4-p04.part01.b64

      - name: Install inspection reconstruction script
        shell: bash
        run: |
          cat > scripts/generate-responsive-images.mjs <<'EOF'
          import { createHash } from 'node:crypto';
          import { access, mkdir, readFile, readdir, writeFile } from 'node:fs/promises';
          import path from 'node:path';
          import { fileURLToPath } from 'node:url';
          import sharp from 'sharp';

          const root = path.resolve(path.dirname(fileURLToPath(import.meta.url)), '..');
          const sourceDir = path.join(root, 'public', 'images');
          const outputDir = path.join(sourceDir, 'generated');
          const assetDir = path.join(root, 'assets');

          async function readParts(prefix) {
            const names = (await readdir(assetDir))
              .filter((name) => name.startsWith(prefix) && name.endsWith('.b64'))
              .sort();
            if (!names.length) throw new Error(`Aucun fragment Base64 trouvé pour ${prefix}`);
            return (
              await Promise.all(names.map((name) => readFile(path.join(assetDir, name), 'utf8')))
            ).map((part) => part.trim()).join('');
          }

          async function restoreBase64Asset(prefix, outputFilename) {
            const base64 = await readParts(`${prefix}.part`);
            await writeFile(path.join(sourceDir, outputFilename), Buffer.from(base64, 'base64'));
          }

          async function restoreFromSegments(segments, outputFilename, validation) {
            const base64Parts = [];
            for (const segment of segments) {
              if (segment.type === 'prefix') base64Parts.push(await readParts(segment.value));
              else base64Parts.push((await readFile(path.join(assetDir, segment.value), 'utf8')).trim());
            }
            const data = Buffer.from(base64Parts.join(''), 'base64');
            const digest = createHash('sha256').update(data).digest('hex');
            console.log(`${outputFilename} SHA-256 ${digest}`);
            const metadata = await sharp(data).metadata();
            console.log(`${outputFilename} dimensions ${metadata.width}x${metadata.height}`);
            if (metadata.width !== validation.width || metadata.height !== validation.height) {
              throw new Error(`Dimensions invalides pour ${outputFilename}: ${metadata.width}x${metadata.height}`);
            }
            await writeFile(path.join(sourceDir, outputFilename), data);
          }

          await restoreBase64Asset('article-03-selected', 'article-03-interchangeable.webp');
          await restoreFromSegments(
            [
              { type: 'prefix', value: 'fix-a2-p01.part' },
              { type: 'file', value: 'article-02-choisir-v3.part02.b64' },
              { type: 'prefix', value: 'fix-a2-p03.part' },
              { type: 'file', value: 'article-02-choisir-v3.part04.b64' },
            ],
            'article-02-choisir-v3.avif',
            { width: 1672, height: 941 },
          );
          await restoreFromSegments(
            [
              { type: 'file', value: 'article-04-composition.part01.b64' },
              { type: 'file', value: 'article-04-composition.part02.b64' },
              { type: 'prefix', value: 'fix-a4-p03.part' },
              { type: 'prefix', value: 'fix-a4-p04.part' },
            ],
            'article-04-composition.avif',
            { width: 1536, height: 1024 },
          );

          const sources = [
            'article-01-remplacer.png',
            'article-02-choisir-v3.avif',
            'article-03-interchangeable.webp',
            'article-04-composition.avif',
            'about-atelier.png',
            'zone-grise-brand.png',
          ];
          const widths = [480, 800, 1200, 1448];
          await mkdir(outputDir, { recursive: true });
          for (const filename of sources) {
            const source = path.join(sourceDir, filename);
            await access(source);
            const stem = path.parse(filename).name;
            const metadata = await sharp(source).metadata();
            const sourceWidth = metadata.width ?? 1448;
            for (const requestedWidth of widths) {
              const width = Math.min(requestedWidth, sourceWidth);
              const output = path.join(outputDir, `${stem}-${requestedWidth}.webp`);
              await sharp(source)
                .resize({ width, withoutEnlargement: true })
                .webp({ quality: 86, effort: 5, smartSubsample: true })
                .toFile(output);
            }
          }
          console.log(`Images responsives générées dans ${path.relative(root, outputDir)}`);
          EOF

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build and inspect Astro site
        env:
          SITE_URL: https://alzahel.github.io
          BASE_PATH: /ZoneGrise
        run: npm run build

      - name: Upload inspection artifact
        uses: actions/upload-artifact@v4
        with:
          name: image-inspection
          path: |
            public/images/article-02-choisir-v3.avif
            public/images/article-04-composition.avif
            public/images/generated/article-02-choisir-v3-1448.webp
            public/images/generated/article-04-composition-1448.webp

      - name: Do not persist during inspection
        if: ${{ false }}
        run: echo disabled

  deploy:
    if: ${{ false }}
    needs: build-and-fix
    runs-on: ubuntu-latest
    steps:
      - run: echo disabled
