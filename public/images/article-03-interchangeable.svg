<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1448 1086" role="img" aria-labelledby="title desc">
  <title id="title">L’humain est-il interchangeable ?</title>
  <desc id="desc">Composition éditoriale abstraite montrant deux silhouettes humaines presque superposées, séparées par une frontière grise et terracotta.</desc>
  <defs>
    <filter id="paper" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.72" numOctaves="3" seed="19" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="grayNoise"/>
      <feComponentTransfer in="grayNoise" result="softNoise">
        <feFuncA type="table" tableValues="0 0.085"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" in2="softNoise" mode="multiply"/>
    </filter>
    <linearGradient id="boundary" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#181714"/>
      <stop offset="0.46" stop-color="#181714"/>
      <stop offset="0.46" stop-color="#9f9990"/>
      <stop offset="0.72" stop-color="#9f9990"/>
      <stop offset="0.72" stop-color="#a94f3a"/>
      <stop offset="1" stop-color="#a94f3a"/>
    </linearGradient>
    <clipPath id="leftHalf"><rect x="0" y="0" width="724" height="1086"/></clipPath>
  </defs>

  <rect width="1448" height="1086" fill="#f4efe5"/>
  <g filter="url(#paper)">
    <rect x="0" y="0" width="1448" height="1086" fill="#f4efe5"/>

    <path d="M0 820 C235 760 376 785 518 848 C647 905 764 887 897 816 C1070 724 1225 710 1448 756 L1448 1086 L0 1086 Z" fill="#e1dbd0"/>
    <path d="M0 865 C218 816 360 840 520 906 C674 970 819 960 972 888 C1118 820 1268 820 1448 854 L1448 1086 L0 1086 Z" fill="#d0c9be" opacity="0.58"/>

    <rect x="122" y="118" width="304" height="1" fill="#181714"/>
    <rect x="122" y="118" width="62" height="5" fill="#a94f3a"/>
    <text x="122" y="96" font-family="Arial, Helvetica, sans-serif" font-size="17" letter-spacing="4" fill="#56514b">ZONE GRISE · ESSAI 03</text>

    <g opacity="0.32">
      <line x1="1168" y1="132" x2="1168" y2="936" stroke="#181714" stroke-width="1" stroke-dasharray="2 12"/>
      <line x1="238" y1="944" x2="1208" y2="944" stroke="#181714" stroke-width="1" stroke-dasharray="2 12"/>
      <circle cx="1168" cy="944" r="8" fill="none" stroke="#181714"/>
    </g>

    <!-- Silhouette A -->
    <g transform="translate(390 188)">
      <ellipse cx="260" cy="270" rx="176" ry="216" fill="#8f8a82"/>
      <rect x="206" y="440" width="110" height="166" rx="42" fill="#8f8a82"/>
      <path d="M62 738 C103 610 186 566 261 566 C344 566 439 612 482 738 Z" fill="#8f8a82"/>
      <path d="M312 252 C351 266 375 293 380 324 C385 358 367 383 340 397 C347 359 335 333 305 314 Z" fill="#f4efe5" opacity="0.82"/>
    </g>

    <!-- Silhouette B, shifted -->
    <g transform="translate(515 170)">
      <ellipse cx="260" cy="270" rx="176" ry="216" fill="#171613"/>
      <rect x="206" y="440" width="110" height="166" rx="42" fill="#171613"/>
      <path d="M62 738 C103 610 186 566 261 566 C344 566 439 612 482 738 Z" fill="#171613"/>
      <path d="M312 252 C351 266 375 293 380 324 C385 358 367 383 340 397 C347 359 335 333 305 314 Z" fill="#f4efe5" opacity="0.9"/>
    </g>

    <!-- Zones de remplacement -->
    <rect x="665" y="168" width="76" height="720" fill="#f4efe5" opacity="0.76"/>
    <rect x="691" y="168" width="22" height="720" fill="#a94f3a" opacity="0.86"/>
    <rect x="616" y="393" width="212" height="188" fill="#c4bdb2" opacity="0.64"/>
    <rect x="734" y="438" width="152" height="84" fill="#f4efe5" opacity="0.78"/>

    <!-- Trait de décision -->
    <path d="M246 667 C389 620 497 644 595 704 C704 771 819 783 1004 707 C1082 674 1166 657 1270 674" fill="none" stroke="#181714" stroke-width="2"/>
    <circle cx="595" cy="704" r="8" fill="#a94f3a"/>
    <circle cx="1004" cy="707" r="8" fill="#a94f3a"/>

    <rect x="119" y="846" width="186" height="9" fill="url(#boundary)"/>
    <text x="119" y="892" font-family="Arial, Helvetica, sans-serif" font-size="15" letter-spacing="5" fill="#5f5a53">DÉPENDANCE</text>
    <text x="119" y="923" font-family="Arial, Helvetica, sans-serif" font-size="15" letter-spacing="5" fill="#5f5a53">DÉCISION</text>
    <text x="119" y="954" font-family="Arial, Helvetica, sans-serif" font-size="15" letter-spacing="5" fill="#a94f3a">SUBSTITUABILITÉ</text>

    <g transform="translate(1138 332) rotate(90)">
      <text x="0" y="0" font-family="Arial, Helvetica, sans-serif" font-size="13" letter-spacing="4" fill="#7a746b">MÊME OUTIL · AUTRE PERSONNE</text>
    </g>

    <text x="888" y="934" font-family="Georgia, 'Times New Roman', serif" font-size="46" fill="#181714">qu’est-ce qui change ?</text>
  </g>
</svg>
